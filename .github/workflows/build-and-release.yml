name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags and branches

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm


      - name: Get version from git tag
        id: get-version
        run: |
          # Remove 'v' prefix from tag to get version number
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          # Update package.json with the version from git tag
          npm version ${{ steps.get-version.outputs.version }} --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the project
        run: pnpm build

      - name: Create build artifact
        run: |
          mkdir -p dist-archive
          cd dist
          zip -r ../dist-archive/shadcn-admin.zip .
          cd ..


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get-version.outputs.tag }}
          body: |
            ## Release ${{ steps.get-version.outputs.tag }}
            
            ### What's Changed
            - Version bumped to ${{ steps.get-version.outputs.version }}
            
            ### Installation
            Download the zip file and extract it to your web server.
          files: |
            dist-archive/shadcn-admin.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
